# Render Blueprint — ScanG API + static web UI
# Dashboard: New → Blueprint → select this repo
# Docs: https://render.com/docs/blueprint-spec
#
# Before first deploy:
# 1. Create a MongoDB Atlas cluster and copy the mongodb+srv:// URI
# 2. Fill secret env vars when Render prompts (sync: false)
# 3. After first API URL exists, set CORS_ORIGINS to the static site origin
# 4. Add the static site host to Firebase Authorized domains

services:
  - type: web
    name: scang-api
    runtime: docker
    plan: free
    rootDir: backend-v2
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: scang
      - key: CORS_ORIGINS
        value: "*"
      - key: FIREBASE_CREDENTIALS_JSON
        sync: false
      - key: INGESTION_ADMIN_KEY
        sync: false

  - type: web
    name: scang-web
    runtime: static
    rootDir: frontend-v2
    buildCommand: yarn install --frozen-lockfile && yarn build:web
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # After API deploy, set to https://scang-api-xxxx.onrender.com (no trailing slash)
      # Or reference RENDER_EXTERNAL_URL from scang-api in the dashboard.
      - key: EXPO_PUBLIC_BACKEND_URL
        fromService:
          name: scang-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: EXPO_PUBLIC_FIREBASE_API_KEY
        sync: false
      - key: EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: EXPO_PUBLIC_FIREBASE_PROJECT_ID
        sync: false
      - key: EXPO_PUBLIC_FIREBASE_APP_ID
        sync: false
      - key: EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID
        sync: false
