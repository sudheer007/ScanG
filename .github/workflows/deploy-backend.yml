name: Deploy backend to Render

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "render.yaml"

jobs:
  trigger-render-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy hook
        run: curl -fsS "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" > /dev/null
