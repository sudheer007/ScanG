# Ping the Render API so the free-tier service does not sleep between users.
# Setup: GitHub repo → Settings → Secrets → Actions → SCANG_API_HEALTH_URL
#   e.g. https://scang-api-xxxx.onrender.com/api/health
#
# Note: GitHub schedule cron can drift by several minutes; prefer cron-job.org
# every 10–14 min for tighter keep-alive. See DEPLOYMENT.md.

name: Keep API warm

on:
  schedule:
    - cron: "*/12 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render health endpoint
        env:
          HEALTH_URL: ${{ secrets.SCANG_API_HEALTH_URL }}
        run: |
          if [ -z "$HEALTH_URL" ]; then
            echo "SCANG_API_HEALTH_URL secret is not set — skip ping."
            exit 0
          fi
          curl --fail --max-time 90 -sS "$HEALTH_URL"
          echo
          echo "Pinged at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
