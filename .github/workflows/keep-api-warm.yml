# Ping the Render API so the free-tier service does not sleep between users.
# Prefer Cloudflare Worker cron (cloudflare/keep-api-warm) for steadier timing.
# Backup: set repo secret SCANG_API_HEALTH_URL
#   e.g. https://scang-api-xxxx.onrender.com/api/health

name: Keep API warm

on:
  schedule:
    # Every 5 min, weekdays, NSE window (UTC) — backup if Cloudflare is down
    - cron: "*/5 3-10 * * 1-5"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render health endpoint
        env:
          HEALTH_URL: ${{ secrets.SCANG_API_HEALTH_URL }}
        run: |
          if [ -z "$HEALTH_URL" ]; then
            echo "::warning::SCANG_API_HEALTH_URL secret is not set — skip ping."
            echo "Prefer Cloudflare Worker (cloudflare/keep-api-warm). Or set this secret as backup."
            exit 0
          fi
          for i in 1 2 3; do
            if curl --fail --max-time 180 -sS "$HEALTH_URL"; then
              echo
              echo "OK at $(date -u +%Y-%m-%dT%H:%M:%SZ) (attempt $i)"
              exit 0
            fi
            echo "Attempt $i failed; retrying in 15s..."
            sleep 15
          done
          echo "::error::All ping attempts failed."
          exit 1
